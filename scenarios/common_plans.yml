PlanOne:
  company: BigInsuranceCo
  description: 'A high-deductible plan with out-of-network coverage and an HSA feature.'
  network_family: BIC
  contributions:
    employee_only: 700
    employee_plus_one: 1000
    family: 2500
  HSA_funding:
    employee_only: 1000
    employee_plus_one: 2000
    family: 2000
  deductibles:
    in_network:
      per_member: false
      member: 2000
      family: 4000
    out_of_network:
      # left undefined as the deductible includes in and out of network
  out_of_network_coverage: true
  out_of_pocket_max:
    in_network:
      per_member: false
      member: 3000
      family: 7000
    out_of_network:
      # left undefined as the out-of-pocket max includes in and out of network
  cost_sharing:
    in_network:
      preventive_care:
        copay: 0
        deductible_applies: false
      primary_care:
        coinsurance: 10
      specialist_visit:
        coinsurance: 10
      outpatient_surgery:
        coinsurance: 10
      emergency_room:
        # HDHP-style ER copay: the deductible applies first, and the copay is
        # waived entirely when the visit results in a hospital admission (the
        # admission is billed separately as a hospital stay).
        copay: 150
        deductible_applies: true
        waived_if_admitted: true
      emergency_transportation:
        coinsurance: 10
      urgent_care:
        coinsurance: 10
      prescription_medicine:
        coinsurance:
          generic: 10
          brand_preferred: 10
          brand_non-preferred: 10
          speciality: 10
        # Drug categories: utilization entries can name a category whose rates
        # replace the tier's. Common patterns: a flat copay for a specialty
        # class that bypasses the deductible, and $0 preventive medications.
        overrides:
          weight_loss_medication:
            copay: 150
            deductible_applies: false
          preventive:
            copay: 0
            deductible_applies: false
        # When a brand drug is dispensed despite a cheaper generic equivalent,
        # the plan shares cost as if the generic were dispensed and the member
        # pays the price difference uncovered.
        generic_substitution: member_pays_difference
      hospital_stay:
        coinsurance: 10
      mental_health_outpatient:
        coinsurance: 10
      mental_health_inpatient:
        coinsurance: 10
      diagnostic_tests:
        coinsurance: 10
      advanced_imaging:
        coinsurance: 10
      prenatal_care:
        copay: 0
        deductible_applies: false
      postnatal_care:
        coinsurance: 10
      childbirth_services:
        coinsurance: 10
      home_healthcare:
        coinsurance: 10
      rehab_outpatient:
        coinsurance: 10
      rehab_inpatient:
        coinsurance: 10
      skilled_nursing_care:
        coinsurance: 10
      durable_medical_equipment:
        coinsurance: 10
      hospice:
        coinsurance: 10
      child_eye_exam:
        copay: 0
      telehealth_visit_medical_care:
        copay: 50
      telehealth_visit_psychologist:
        copay: 100
      telehealth_visit_social_worker:
        copay: 75
    out_of_network:
      preventive_care:
        coinsurance: 20
      primary_care:
        coinsurance: 30
      specialist_visit:
        coinsurance: 30
      outpatient_surgery:
        coinsurance: 30
      emergency_room:
        copay: 150
        deductible_applies: true
        waived_if_admitted: true
      emergency_transportation:
        coinsurance: 10
      urgent_care:
        coinsurance: 30
      prescription_medicine:
        coinsurance:
          generic: 30
          brand_preferred: 30
          brand_non-preferred: 30
        generic_substitution: member_pays_difference
      hospital_stay:
        coinsurance: 30
      mental_health_outpatient:
        coinsurance: 30      
      mental_health_inpatient:
        coinsurance: 30
      diagnostic_tests:
        coinsurance: 30
      advanced_imaging:
        coinsurance: 30
      prenatal_care:
        coinsurance: 20
      postnatal_care:
        coinsurance: 30
      childbirth_services:
        coinsurance: 30
      home_healthcare:
        coinsurance: 30
      rehab_outpatient:
        coinsurance: 30
      rehab_inpatient:
        coinsurance: 30
      skilled_nursing_care:
        coinsurance: 30
      durable_medical_equipment:
        coinsurance: 30
      hospice:
        coinsurance: 30
      child_eye_exam:
        coinsurance: 20
      telehealth_visit_medical_care:
        copay: 50
      telehealth_visit_psychologist:
        copay: 100
      telehealth_visit_social_worker:
        copay: 75
