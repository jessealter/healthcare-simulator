Plan B:
  company: Tiny Insurance Co
  description: 'A plan with no deductible, low copays, and no out-of-network coverage.'
  network_family: TIC
  contributions:
    employee_only: 1800
    employee_plus_one: 5000
    family: 7000
  HSA_funding: null
  deductibles:
    in_network:
      per_member: false
      member: 0
      family: 0
  out_of_network_coverage: false
  out_of_pocket_max:
    in_network:
      per_member: true
      member: 3000
      family: 6000
  cost_sharing:
    in_network:
      preventive_care:
        copay: 0
      primary_care:
        copay: 20
      specialist_visit:
        copay: 20
      outpatient_surgery:
        copay: 20
      emergency_room:
        copay: 100
      emergency_transportation:
        copay: 75
      urgent_care:
        copay: 20
      prescription_medicine:
        copay:
          generic: 10
          brand_preferred: 25
          brand_non-preferred: 25
          speciality: 25
        # Category overrides: no-cost contraceptives and preventive drugs.
        overrides:
          contraceptive:
            copay: 0
            deductible_applies: false
          preventive:
            copay: 0
            deductible_applies: false
      hospital_stay:
        copay: 250
      mental_health_outpatient:
        copay: 20
      mental_health_inpatient:
        copay: 250
      prenatal_care:
        copay: 0
      postnatal_care:
        copay: 0
      childbirth_services:
        copay: 250
      home_healthcare:
        copay: 0
      rehab_outpatient:
        copay: 20
      rehab_inpatient:
        copay: 250
      skilled_nursing_care:
        copay: 0
        # Day caps are common: covered for the first N days per benefit
        # period, full price thereafter.
        limit: {max: 100}
      durable_medical_equipment:
        # Some HMOs exclude certain cost sharing from the out-of-pocket
        # maximum: it never reduces the OOP max and keeps charging after it.
        coinsurance: 50
        counts_toward_oop_max: false
      hospice:
        copay: 0
      child_eye_exam:
        copay: 0
      # Allowance benefit: the plan pays up to $150 toward children's
      # glasses or contacts (per benefit period — your utilization profile
      # decides how often to invoke it); the member pays the excess.
      child_eyewear:
        copay: 0
        max_plan_paid: 150
        counts_toward_oop_max: false
      diagnostic_tests:
        copay: 10
      advanced_imaging:
        copay: 50
      telehealth_visit_medical_care:
        copay: 0
      telehealth_visit_psychologist:
        copay: 0
      telehealth_visit_social_worker:
        copay: 0
