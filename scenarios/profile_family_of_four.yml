# Family of Four / Asthma Management
# The family of Jane, Barbara, Phil, and Cameron prioritize their health with regular checkups and preventive care.
# Phil manages his moderate-to-severe asthma with regular medical oversight and maintains an active lifestyle.
Jane:
  service_utilization:
    in_network:
      primary_care: 1
  medications: {}
Barbara:
  service_utilization:
    in_network:
      primary_care: 1
      specialist_visit: 0
  medications: {}
Phil:
  service_utilization:
    in_network:
      primary_care: 2
      specialist_visit: 2
      diagnostic_tests: 1
      # A structured entry: an ER visit that led to a hospital admission.
      # Plans with waived_if_admitted charge nothing for the ER line itself;
      # the admission is billed separately below. A plain count (e.g.
      # "emergency_room: 1") means a visit that did NOT lead to admission.
      emergency_room:
        count: 1
        admitted: true
      hospital_stay: 1
  medications:
    inhaled_corticosteroids:
      type: brand_preferred
      frequency: 12
    salbutamol:
      type: generic
      frequency: 4
Cameron:
  service_utilization:
    in_network:
      primary_care: 1
      specialist_visit: 0
  medications: {}
